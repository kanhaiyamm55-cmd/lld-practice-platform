<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLD Coach — Zero Setup Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fc;color:#172033;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.nav{height:72px;background:#fff;border-bottom:1px solid #e7e9ef;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1120px)/2));position:sticky;top:0;z-index:10}.brand{font-size:21px;font-weight:850;letter-spacing:-.03em}.brand b{color:#6558e8}.nav button{border:0;background:transparent;padding:10px 14px;color:#667085;font-weight:700}.nav button.active{color:#6558e8}.wrap{max-width:1120px;margin:auto;padding:50px 22px 90px}.eyebrow{color:#6558e8;font-size:11px;font-weight:850;letter-spacing:.16em}.hero h1{font-size:58px;line-height:1.02;letter-spacing:-.055em;margin:14px 0}.hero h1 span{color:#6558e8}.hero p{max-width:700px;color:#667085;font-size:18px;line-height:1.65}.loop{display:inline-flex;background:#eeecff;color:#584cd3;padding:9px 13px;border-radius:30px;font-size:12px;font-weight:800;margin:14px 0 36px}.head{display:flex;justify-content:space-between;align-items:end;margin:25px 0 16px}.head h2{margin:0;font-size:22px}.head p{margin:4px 0;color:#8790a0;font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card,.panel{background:#fff;border:1px solid #e7e9ef;border-radius:18px;box-shadow:0 10px 35px rgba(23,32,51,.055)}.card{padding:23px;min-height:360px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between}.ico{width:44px;height:44px;border-radius:13px;background:#efedff;color:#5f51dc;display:grid;place-items:center;font-weight:850}.pill{font-size:11px;font-weight:850;color:#5b4ed5;background:#efedff;padding:6px 9px;border-radius:30px;height:max-content}.card h3{font-size:25px;margin:23px 0 7px}.card p{color:#697386;line-height:1.55}.card ul{padding-left:18px;color:#667085;line-height:1.8;font-size:13px;flex:1}.btn{border:0;border-radius:10px;padding:13px 16px;background:#171d2c;color:#fff;font-weight:800}.btn.primary{background:#6558e8}.btn.light{background:#f0efff;color:#594bd5}.detail{max-width:820px;margin:auto}.back{border:0;background:transparent;color:#697386;padding:0 0 25px}.detailHead{display:flex;justify-content:space-between}.detail h1,.practice h1{font-size:46px;letter-spacing:-.04em;margin:11px 0}.bigico{width:82px;height:82px;border-radius:20px;background:#efedff;color:#5f51dc;display:grid;place-items:center;font-size:30px;font-weight:850}.lead{font-size:18px;color:#667085;line-height:1.65}.panel{padding:25px;margin-top:18px}.req{display:flex;gap:14px;padding:14px 0;border-top:1px solid #edf0f4}.req b{color:#6558e8}.call{margin:18px 0;padding:17px;background:#f0efff;border-radius:13px;color:#5148a5}.call span{display:block;color:#77718d;font-size:13px;margin-top:4px}.practice{max-width:900px;margin:auto}.phead{display:flex;justify-content:space-between}.status{font-size:11px;font-weight:850;background:#fff3dd;color:#a66d08;border-radius:20px;padding:7px 10px;height:max-content}.strip{margin:16px 0;background:#202637;color:#e6e8ef;padding:13px 16px;border-radius:11px;font-size:12px;line-height:1.7}.editor h2{font-size:19px;margin:0}.editor p{color:#80899a;font-size:13px}.edtitle{display:flex;justify-content:space-between;align-items:start}.small{border:1px solid #dddff0;background:#fff;color:#5d50d8;border-radius:9px;padding:8px 11px;font-weight:800}.row{display:grid;grid-template-columns:1fr 1.6fr auto;gap:9px;margin-top:9px}.row.three{grid-template-columns:1fr 1fr 1fr auto}.row input,textarea{width:100%;border:1px solid #dfe2ea;border-radius:9px;padding:11px;outline:0;background:#fff}.row input:focus,textarea:focus{border-color:#7368e7;box-shadow:0 0 0 3px #7368e718}.remove{border:0;background:#fff0f0;color:#c95757;border-radius:9px;width:38px}.submitbar{display:flex;justify-content:space-between;align-items:center;padding:20px 0}.hint{font-size:13px;color:#7b8493}.scoreHero{display:flex;justify-content:space-between;align-items:center}.scoreCircle{width:125px;height:125px;border-radius:50%;background:#efedff;color:#5e51d9;display:grid;place-items:center;align-content:center}.scoreCircle strong{font-size:46px;line-height:1}.scoreCircle span{font-size:12px;font-weight:800}.scores{display:grid;gap:14px}.srow{display:grid;grid-template-columns:180px 1fr 55px;gap:12px;align-items:center;font-size:13px}.bar{height:9px;background:#eceef4;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#6558e8}.fbgrid{display:grid;grid-template-columns:1fr 1.5fr;gap:18px}.good{padding:12px;background:#effaf3;color:#2a7c4d;border-radius:9px;margin-top:9px;font-size:13px}.item{border-top:1px solid #edf0f4;padding:15px 0}.sev{font-size:9px;text-transform:uppercase;font-weight:900;padding:4px 7px;border-radius:7px}.sev.medium{background:#fff0d8;color:#a66d08}.sev.low{background:#efefff;color:#5d50d8}.item h3{margin:8px 0}.item p{color:#697386;font-size:13px;line-height:1.5}.center{text-align:center;padding:24px}.hist{display:grid;gap:10px}.histrow{display:grid;grid-template-columns:45px 1fr auto 65px 20px;align-items:center;gap:13px;padding:15px 18px}.histrow small{display:block;color:#8a92a1;font-size:11px;margin-top:3px}.empty{text-align:center;color:#7a8494;padding:45px}.toast{position:fixed;right:20px;bottom:20px;background:#171d2c;color:#fff;padding:13px 16px;border-radius:10px;box-shadow:0 10px 30px #0003;font-size:13px;display:none}.muted{color:#7d8696;font-size:13px}@media(max-width:800px){.cards,.fbgrid{grid-template-columns:1fr}.hero h1{font-size:42px}.row,.row.three{grid-template-columns:1fr}.remove{width:100%}.scoreHero{align-items:flex-start;gap:15px}.scoreCircle{width:95px;height:95px}.scoreCircle strong{font-size:34px}.srow{grid-template-columns:115px 1fr 45px}.histrow{grid-template-columns:42px 1fr auto}.histrow .status{display:none}}
</style></head>
<body><nav class="nav"><div class="brand">◈ LLD <b>Coach</b></div><div><button id="navProblems" class="active">Problems</button><button id="navHistory">History</button></div></nav><main id="app" class="wrap"></main><div id="toast" class="toast"></div>
<script>
const problems=[
{id:'parking-lot',title:'Parking Lot',difficulty:'Easy',description:'Design a parking lot that supports multiple vehicle types, parking spots, tickets and fee calculation.',req:['Support car, bike, and truck vehicles.','Support different parking spot types.','Generate a ticket when a vehicle enters.','Calculate parking fees when a vehicle exits.','Keep pricing replaceable without rewriting ParkingLot.']},
{id:'vending-machine',title:'Vending Machine',difficulty:'Medium',description:'Design a vending machine that accepts money, selects products, dispenses items and returns change.',req:['Support multiple products and quantities.','Accept and validate money.','Allow product selection.','Dispense a product only when payment is sufficient.','Return change and handle out-of-stock products.']},
{id:'elevator',title:'Elevator System',difficulty:'Medium',description:'Design an elevator system with multiple elevators, floor requests, movement and request assignment.',req:['Support multiple elevators.','Accept internal and external floor requests.','Assign requests to suitable elevators.','Model elevator state and direction.','Keep request assignment policy replaceable.']}
];
let page='problems',selected=null,attempt=null;
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem('lldAttempts',JSON.stringify(attempts()))} function attempts(){return JSON.parse(localStorage.getItem('lldAttempts')||'[]')}
function toast(x){let t=$('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function layout(){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$('#nav'+(page==='history'?'History':'Problems')).classList.add('active');}
function render(){layout();const a=$('#app'); if(page==='problems')return problemsPage(a);if(page==='detail')return detailPage(a);if(page==='practice')return practicePage(a);if(page==='feedback')return feedbackPage(a);historyPage(a)}
function problemsPage(a){a.innerHTML=`<section class="hero"><div class="eyebrow">PRACTICE • THINK • IMPROVE</div><h1>Get better at<br><span>Low-Level Design.</span></h1><p>Practice real LLD problems, submit your design, and get explainable feedback on responsibilities, abstractions, relationships and extensibility.</p><div class="loop">Choose → Design → Feedback → Retry</div></section><div class="head"><div><h2>Practice problems</h2><p>Pick a problem and start designing.</p></div></div><div class="cards">${problems.map(p=>`<article class="card"><div class="top"><span class="ico">${p.title[0]}</span><span class="pill">${p.difficulty}</span></div><h3>${p.title}</h3><p>${p.description}</p><ul>${p.req.slice(0,3).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="btn" onclick="openDetail('${p.id}')">View problem →</button></article>`).join('')}</div>`}
function openDetail(id){selected=problems.find(p=>p.id===id);page='detail';render()}
function detailPage(a){a.innerHTML=`<section class="detail"><button class="back" onclick="page='problems';render()">← All problems</button><div class="detailHead"><div><span class="pill">${selected.difficulty}</span><h1>${selected.title}</h1></div><div class="bigico">${selected.title[0]}</div></div><p class="lead">${selected.description}</p><div class="panel"><h2>Requirements</h2>${selected.req.map((r,i)=>`<div class="req"><b>0${i+1}</b><span>${esc(r)}</span></div>`).join('')}</div><div class="call"><b>What makes a good solution?</b><span>Focus on clear responsibilities, useful abstractions, relationships, extensibility and trade-offs.</span></div><button class="btn primary" onclick="start('${selected.id}')">Start practice →</button></section>`}
function start(id){selected=problems.find(p=>p.id===id);attempt={id:crypto.randomUUID(),problemId:id,status:'DRAFT',created:new Date().toISOString(),data:{classes:[],interfaces:[],relationships:[],explanation:''}};page='practice';render()}
function add(type){const inp=$('#new'+type);if(!inp.value.trim())return;const x=inp.value.trim();let item=type==='Class'?{name:x,responsibility:''}:type==='Interface'?{name:x,purpose:''}:{from:x.split('->')[0]?.trim(),to:x.split('->')[1]?.trim(),type:'association'};attempt.data[type.toLowerCase()+'s'].push(item);inp.value='';render()}
function practicePage(a){let d=attempt.data;let p=problems.find(x=>x.id===attempt.problemId);a.innerHTML=`<section class="practice"><div class="phead"><div><span class="pill">${p.difficulty}</span><h1>${p.title}</h1></div><span class="status">● ${attempt.status}</span></div><div class="strip"><b>Requirements:</b> ${p.req.join(' • ')}</div><div class="panel editor"><div class="edtitle"><div><h2>1. Define your classes</h2><p>Give each class one focused responsibility.</p></div><button class="small" onclick="add('Class')">+ Add class</button></div><div class="row"><input id="newClass" placeholder="Class name e.g. ParkingLot"><input placeholder="Responsibility" disabled></div>${d.classes.map((x,i)=>`<div class="row"><input value="${esc(x.name)}" onchange="attempt.data.classes[${i}].name=this.value"><input value="${esc(x.responsibility)}" onchange="attempt.data.classes[${i}].responsibility=this.value"><button class="remove" onclick="attempt.data.classes.splice(${i},1);render()">×</button></div>`).join('')}</div><div class="panel editor"><div class="edtitle"><div><h2>2. Add abstractions</h2><p>Use interfaces at genuine variation points.</p></div><button class="small" onclick="add('Interface')">+ Add interface</button></div><input id="newInterface" placeholder="Interface name e.g. PricingStrategy">${d.interfaces.map((x,i)=>`<div class="row"><input value="${esc(x.name)}" onchange="attempt.data.interfaces[${i}].name=this.value"><input value="${esc(x.purpose)}" onchange="attempt.data.interfaces[${i}].purpose=this.value"><button class="remove" onclick="attempt.data.interfaces.splice(${i},1);render()">×</button></div>`).join('')}</div><div class="panel editor"><div class="edtitle"><div><h2>3. Describe relationships</h2><p>Show how objects collaborate.</p></div><button class="small" onclick="add('Relationship')">+ Add relationship</button></div><input id="newRelationship" placeholder="e.g. ParkingLot -> Ticket">${d.relationships.map((x,i)=>`<div class="row three"><input value="${esc(x.from)}" onchange="attempt.data.relationships[${i}].from=this.value"><input value="${esc(x.to)}" onchange="attempt.data.relationships[${i}].to=this.value"><input value="${esc(x.type)}" onchange="attempt.data.relationships[${i}].type=this.value"><button class="remove" onclick="attempt.data.relationships.splice(${i},1);render()">×</button></div>`).join('')}</div><div class="panel editor"><h2>4. Explain your design</h2><p>Explain responsibilities, abstractions, trade-offs and extensibility.</p><textarea rows="8" id="reason" placeholder="Example: PricingStrategy keeps fee calculation separate from ParkingLot...">${esc(d.explanation)}</textarea></div><div class="submitbar"><span class="hint">Your design is evaluated locally in this zero-setup demo.</span><button class="btn primary" onclick="submitDemo()">Submit for feedback →</button></div></section>`;$('#reason').oninput=()=>attempt.data.explanation=$('#reason').value}
function submitDemo(){attempt.status='COMPLETED';attempt.evaluation=evaluate(attempt.data);let arr=attempts();arr.unshift(attempt);localStorage.setItem('lldAttempts',JSON.stringify(arr.slice(0,30)));page='feedback';render();toast('Submission evaluated successfully')}
function evaluate(d){let classes=d.classes.filter(x=>x.name.trim()&&x.responsibility.trim()),ints=d.interfaces.filter(x=>x.name.trim()),rels=d.relationships.filter(x=>x.from.trim()&&x.to.trim()),ex=d.explanation.trim();let cat=[['Responsibilities',Math.min(20,classes.length*7)],['Abstraction',ints.length?15:7],['Relationships',Math.min(15,rels.length*7)],['Extensibility',/strategy|pricing|allocation|payment|state/i.test(JSON.stringify(d))?15:9],['SOLID',/solid|single responsibility|open.?closed|composition|dependency inversion/i.test(JSON.stringify(d))?10:5],['Reasoning',ex.length>=80?10:ex.length?6:2]];let raw=cat.reduce((s,x)=>s+x[1],0),score=Math.round(raw/95*100);let im=[];if(!classes.length)im.push(['high','Add domain classes','An LLD solution needs concrete objects with focused responsibilities.','Start with the main nouns in the requirements and assign each a clear responsibility.']);else if(classes.length<3)im.push(['medium','Add more domain objects','Several business responsibilities are still implicit.','Identify the object responsible for each important business rule.']);if(!ints.length)im.push(['medium','Consider an interface','A changeable policy can benefit from an abstraction boundary.','Consider pricing, allocation, payment or another behaviour that may vary.']);if(rels.length<2)im.push(['medium','Make relationships explicit','LLD is about object collaboration, not only a list of classes.','Describe association, composition, inheritance or dependency.']);if(ex.length<80)im.push(['low','Explain your trade-offs','Reasoning is what distinguishes one valid design from another.','Explain one alternative and why your chosen design is preferable.']);let strengths=[];if(classes.length>=3)strengths.push('You identified a useful set of domain objects.');if(ints.length)strengths.push('An interface creates a useful variation point.');if(rels.length>=2)strengths.push('The design explicitly describes object collaboration.');if(ex.length>=80)strengths.push('The explanation contains enough reasoning to discuss trade-offs.');if(!strengths.length)strengths.push('Your submission is saved and ready for another iteration.');return{score,categories:cat,strengths,improvements:im}}
function feedbackPage(a){let e=attempt.evaluation;a.innerHTML=`<section><button class="back" onclick="page='history';render()">← History</button><div class="panel scoreHero"><div><div class="eyebrow">YOUR DESIGN</div><h1>${selected.title}</h1><p class="muted">Use the feedback to make your next design iteration stronger.</p></div><div class="scoreCircle"><strong>${e.score}</strong><span>/100</span></div></div><div class="panel"><h2>Score breakdown</h2><div class="scores">${e.categories.map(c=>`<div class="srow"><span>${c[0]}</span><div class="bar"><i style="width:${Math.min(100,c[1]/(c[0]==='Responsibilities'?20:c[0]==='Abstraction'?15:c[0]==='Relationships'?15:c[0]==='Extensibility'?15:c[0]==='SOLID'?10:10)*100)}%"></i></div><b>${c[1]}</b></div>`).join('')}</div></div><div class="fbgrid"><div class="panel"><h2>✓ What went well</h2>${e.strengths.map(x=>`<div class="good">${esc(x)}</div>`).join('')}</div><div class="panel"><h2>⚠ What to improve</h2>${e.improvements.map(x=>`<div class="item"><span class="sev ${x[0]}">${x[0]}</span><h3>${x[1]}</h3><p><b>Why:</b> ${x[2]}</p><p><b>Try:</b> ${x[3]}</p></div>`).join('')||'<p class="muted">No major issues detected.</p>'}</div></div><div class="center"><button class="btn primary" onclick="start('${attempt.problemId}')">Try again →</button></div></section>`}
function historyPage(a){let list=attempts();a.innerHTML=`<section><div class="hero"><div class="eyebrow">YOUR PROGRESS</div><h1>Practice history</h1><p>Review previous attempts and turn feedback into improvement.</p></div><div class="hist">${list.length?list.map(x=>{let p=problems.find(y=>y.id===x.problemId);return `<div class="panel histrow"><span class="ico">${p.title[0]}</span><div><b>${p.title}</b><small>${new Date(x.created).toLocaleString()}</small></div><span class="status">${x.status}</span><strong>${x.evaluation?.score??'—'}<small>/100</small></strong><button class="small" onclick="review('${x.id}')">Review →</button></div>`}).join(''):'<div class="panel empty">No attempts yet. Start a problem to build your practice history.</div>'}</div></section>`}
function review(id){attempt=attempts().find(x=>x.id===id);selected=problems.find(x=>x.id===attempt.problemId);page=attempt.evaluation?'feedback':'practice';render()}
$('#navProblems').onclick=()=>{page='problems';render()};$('#navHistory').onclick=()=>{page='history';render()};render();
</script></body></html>
